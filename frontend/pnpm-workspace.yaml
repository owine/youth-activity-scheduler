# All pnpm project config lives here. pnpm 11 reads only auth and registry
# settings from .npmrc and silently ignores everything else, so settings put
# there are dead config — that is why this repo has no .npmrc.
# https://pnpm.io/settings
allowBuilds:
  msw: true

# Supply-chain hardening.
# Do NOT add minimumReleaseAge here — the release-age soak belongs to the shared
# Renovate preset, and a second pnpm-side gate is adversarial rather than
# additive. Rationale in CLAUDE.md under "Gotchas".
preferFrozenLockfile: true
saveExact: true

audit:
  level: moderate
