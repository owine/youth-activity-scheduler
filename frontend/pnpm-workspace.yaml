# All pnpm project config lives here. pnpm reads only auth and registry settings
# from .npmrc and silently ignores everything else, so settings put there are
# dead config — that is why this repo has no .npmrc.
#
# Every key below must be one pnpm 12 recognizes: since packageManager pins a
# version this pnpm satisfies, an unknown key is a hard
# ERR_PNPM_UNRECOGNIZED_WORKSPACE_SETTINGS, not a warning. Adding a setting from
# a newer pnpm means bumping packageManager in the same commit.
# https://pnpm.io/settings
allowBuilds:
  # Its postinstall only downloads the binary as a fallback. The binary already
  # arrives as a per-platform optionalDependency (@sentry/cli-linux-x64 etc.,
  # static builds that run on Alpine), so the network-fetching script stays off.
  '@sentry/cli': false
  msw: true

# Supply-chain hardening.
# Do NOT add minimumReleaseAge here — the release-age soak belongs to the shared
# Renovate preset, and a second pnpm-side gate is adversarial rather than
# additive. Rationale in CLAUDE.md under "Gotchas".
preferFrozenLockfile: true
saveExact: true

audit:
  level: moderate
