# Overlay for local macOS development.
#
# SQLite + Docker-on-macOS bind mounts produce `disk I/O error` under
# concurrent access: Docker Desktop's VirtioFS file sharing doesn't fully
# support SQLite's locking primitives. Real Linux deployments are unaffected
# (native kernel locking works) — this overlay is purely for local dev.
#
# The single-container layout removes cross-process contention, but one process
# still holds a SQLAlchemy connection pool — several connections to the same
# file — so this overlay is retained until someone actually reproduces the
# bug's absence on a bind mount.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.macos.yml up -d
#
# Trade-off: the DB lives inside a Docker-managed named volume rather than
# on the host filesystem. To inspect it:
#   docker compose -f docker-compose.yml -f docker-compose.macos.yml \
#       exec yas sqlite3 /data/activities.db '.tables'

services:
  yas:
    volumes:
      - yas-data:/data

volumes:
  yas-data:
