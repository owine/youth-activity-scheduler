name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  # Detect which areas of the codebase changed so docker-build can skip
  # on PRs that don't touch image inputs (docs-only, spec-only, etc.).
  # On push-to-main we still build unconditionally — every published
  # image gets multi-arch verification.
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706  # v4.0.2
        id: filter
        with:
          filters: |
            image:
              - 'Dockerfile'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'src/**'
              - 'alembic/**'
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - 'frontend/.npmrc'
              - 'frontend/vite.config.ts'
              - 'frontend/tsconfig*.json'
              - 'frontend/src/**'
              - 'frontend/index.html'
              - 'frontend/public/**'
              - '.github/workflows/ci.yml'

  check:
    runs-on: ubuntu-latest
    env:
      YAS_ANTHROPIC_API_KEY: sk-test-nonop
      YAS_DATABASE_URL: sqlite+aiosqlite:///data/activities.db
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.14
      - name: Install deps
        run: uv sync --all-extras --dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy src
      - name: Migrations apply cleanly
        run: |
          mkdir -p data
          uv run alembic upgrade head
      - name: Tests
        run: uv run pytest -v

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: Format check
        run: pnpm run format:check
      - name: Tests
        run: pnpm run test

  e2e:
    runs-on: ubuntu-latest
    env:
      YAS_ANTHROPIC_API_KEY: sk-test-nonop
      YAS_DATABASE_URL: sqlite+aiosqlite:///data/activities.db
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Set up Python
        run: uv python install 3.14
      - name: Install backend deps
        run: uv sync --all-extras --dev
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Build frontend
        run: pnpm run build
        working-directory: frontend
      - name: Apply migrations
        # Runtime `python -m yas api` also migrates on startup, but the seed
        # step below writes rows and needs the schema in place before the API
        # boots. Use the `migrate` mode so this path stays canonical.
        run: |
          mkdir -p data
          uv run python -m yas migrate
      - name: Seed e2e fixtures
        run: uv run python scripts/seed_e2e.py "$YAS_DATABASE_URL"
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: Start API
        env:
          YAS_STATIC_DIR: ${{ github.workspace }}/frontend/dist
          YAS_PORT: "8080"
        run: |
          uv run python -m yas api > /tmp/yas-api.log 2>&1 &
          echo $! > /tmp/yas-api.pid
      - name: Wait for /healthz
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8080/healthz >/dev/null; then
              echo "API ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API did not become ready in 30s; api log:" >&2
          cat /tmp/yas-api.log >&2 || true
          exit 1
      - name: Run Playwright
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
        run: pnpm exec playwright test
        working-directory: frontend
      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/yas-api.pid ]; then
            kill "$(cat /tmp/yas-api.pid)" 2>/dev/null || true
          fi
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  docker-build:
    # Verify the Dockerfile builds on both supported runtime architectures.
    # Native runners (no QEMU emulation) per arch via matrix.
    #
    # On push-to-main, also pushes each arch by-digest to GHCR. The
    # docker-publish job then assembles a multi-arch manifest. PRs only
    # build (no push), preserving the security boundary.
    #
    # Conditional: on PRs, only run when files that affect the image
    # actually changed (Dockerfile, src/**, frontend/**, deps, ci.yml).
    # Pure docs/spec PRs skip the build entirely. On push-to-main we
    # always run — every published image gets multi-arch verification.
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.image == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercase)
        id: image
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"

      - name: Compute OCI metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.title=Youth Activity Scheduler
            org.opencontainers.image.description=Self-hosted youth-activity scheduler with crawl, matching, and alerting.
            org.opencontainers.image.licenses=MIT

      - name: Build (push by digest on main)
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # On main: push by-digest so the publish job can stitch a multi-arch
          # manifest. On PRs: just build to verify the Dockerfile.
          outputs: |
            type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # OCI labels (manifest-level, zero Dockerfile cache impact). The
          # metadata-action auto-fills source/revision/created/url/version
          # from the workflow context.
          labels: ${{ steps.meta.outputs.labels }}
          # GIT_SHA is consumed by the trailing ARG/ENV in the Dockerfile so
          # the running container can report its commit at /healthz. Placed
          # last in the Dockerfile so this only invalidates the trailing
          # layer (which busts every commit anyway via the source COPY).
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    # Stitch the per-arch digests pushed by docker-build into a single
    # multi-arch manifest, tagged `latest`, `main`, and `sha-<short>`.
    #
    # Future (semver releases): when cutting `git tag v1.0.0 && git push --tags`,
    # add a parallel job triggered on `push: tags: ['v*']` that uses
    # docker/metadata-action to compute v1.0.0 / v1.0 / v1 / latest tags from
    # the git ref. At that point, the `latest` tag below should drop in favor
    # of the tag-driven version so `latest` always tracks releases, not main
    # HEAD. See PR #16 description (or the docs/) for the full sketch.
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name (lowercase)
        id: image
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "name=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"

      - name: Compute OCI annotations for manifest
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.title=Youth Activity Scheduler
            org.opencontainers.image.description=Self-hosted youth-activity scheduler with crawl, matching, and alerting.
            org.opencontainers.image.licenses=MIT

      - name: Create multi-arch manifest + push
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          SHA: ${{ github.sha }}
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          short_sha="${SHA:0:7}"
          # Convert metadata-action's annotations to --annotation flags.
          # metadata-action emits "manifest:<key>=<value>" which buildx
          # imagetools create rejects ("manifest annotations not supported
          # yet"). Strip the manifest: prefix and replace with index:
          # since the multi-arch manifest IS an OCI image index — that's
          # what GHCR's package page surfaces.
          # Skip lines whose value is empty (metadata-action emits blank
          # entries for fields like description/licenses where it didn't
          # auto-resolve a value; the explicit `labels:` above handle them
          # at the per-arch image level instead).
          ann_args=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            stripped="${line#manifest:}"
            value="${stripped#*=}"
            [ -z "$value" ] && continue
            ann_args+=("--annotation" "index:${stripped}")
          done <<< "$ANNOTATIONS"
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:main" \
            --tag "${IMAGE}:sha-${short_sha}" \
            "${ann_args[@]}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:latest"

  # Stable-named aggregator so the branch ruleset can require a single
  # `ci-pass` check regardless of the matrix dimensions (the per-axis
  # `docker-build (linux/amd64, ubuntu-24.04, amd64)` names disappear
  # whenever a runner image rotates, and a job-level `if:` on the matrix
  # parent means the axis check names are never created at all — leaving
  # docs-only PRs permanently BLOCKED with "expected check not reported").
  # Treats SKIPPED as success: docs-only PRs skip docker-build via
  # `changes`, and the aggregator must not block those merges.
  # Pattern: owine/house-manager#191 (aggregator) + owine/trip-tracker
  # ci.yml `docker-build` (skipped-as-success).
  ci-pass:
    needs: [changes, check, frontend-check, e2e, docker-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were appropriately skipped
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # Log only the per-job `result` field, never the full `needs` blob.
          # `outputs` declared by upstream jobs can carry sensitive values
          # if anyone adds one in the future; restricting the dump to results
          # keeps the diagnostic ("which job failed?") without the leak risk.
          echo "$NEEDS_JSON" | jq 'map_values({result})'
          # Whitelist acceptable results so future result types ('neutral',
          # 'action_required', etc.) fail closed instead of silently passing.
          if echo "$NEEDS_JSON" | jq -e 'any(.[].result; . != "success" and . != "skipped")' >/dev/null; then
            echo "::error::One or more required jobs did not succeed or skip."
            exit 1
          fi
