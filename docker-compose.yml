# Single-container layout: api + worker in one process (`python -m yas all`).
#
# One interpreter, one SQLAlchemy engine and pool, and one shared set of
# httpx / Playwright / Anthropic / Nominatim clients. A worker fault exits the
# process (see yas.__main__._supervise) and `restart: unless-stopped` brings it
# back, which is what a per-container crash used to do.
#
# For separate api/worker containers, use docker-compose.split.yml INSTEAD of
# this file.

services:
  yas:
    image: ghcr.io/owine/youth-activity-scheduler:latest
    command: ["python", "-m", "yas", "all"]
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
    # No healthcheck: block here on purpose. This service serves HTTP, so it
    # inherits the image's own `curl /healthz` HEALTHCHECK correctly. The old
    # yas-worker needed `disable: true` only because it ran no HTTP server.
